<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>登录测试页面</h1>
    
    <div class="form-group">
        <label for="username">用户名:</label>
        <input type="text" id="username" value="admin">
    </div>
    
    <div class="form-group">
        <label for="password">密码:</label>
        <input type="password" id="password" value="123456">
    </div>
    
    <button onclick="testLogin()">测试登录</button>
    <button onclick="testGetUserInfo()">获取用户信息</button>
    <button onclick="clearResult()">清除结果</button>
    
    <div id="result"></div>
    
    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = isSuccess ? 'success' : 'error';
        }
        
        function clearResult() {
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = '';
        }
        
        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                showResult('正在登录...', true);
                
                const response = await fetch(`${API_BASE}/user/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // 重要：允许携带Cookie
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                let message = `登录响应:\n`;
                message += `状态码: ${response.status}\n`;
                message += `响应数据: ${JSON.stringify(data, null, 2)}\n\n`;
                
                // 检查 Set-Cookie
                const setCookie = response.headers.get('Set-Cookie');
                message += `Set-Cookie: ${setCookie || '未设置'}\n`;
                
                showResult(message, response.ok);
                
                if (response.ok && data.code === 200) {
                    showResult(message + '\n✅ 登录成功！现在可以点击"获取用户信息"测试Session', true);
                }
            } catch (error) {
                showResult(`❌ 登录失败:\n${error.message}`, false);
            }
        }
        
        async function testGetUserInfo() {
            try {
                showResult('正在获取用户信息...', true);
                
                const response = await fetch(`${API_BASE}/user/info`, {
                    method: 'GET',
                    credentials: 'include', // 重要：允许携带Cookie
                });
                
                const data = await response.json();
                
                let message = `用户信息响应:\n`;
                message += `状态码: ${response.status}\n`;
                message += `响应数据: ${JSON.stringify(data, null, 2)}\n`;
                
                if (response.status === 401) {
                    message += '\n❌ Session 未能正确传递！';
                    showResult(message, false);
                } else if (response.ok && data.code === 200) {
                    message += '\n✅ Session 正常工作！';
                    showResult(message, true);
                } else {
                    showResult(message, false);
                }
            } catch (error) {
                showResult(`❌ 获取用户信息失败:\n${error.message}`, false);
            }
        }
    </script>
</body>
</html>
