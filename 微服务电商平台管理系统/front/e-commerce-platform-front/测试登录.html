<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>🧪 登录功能测试</h1>

    <div class="test-section">
        <h2>测试登录</h2>
        <div>
            <input type="text" id="username" placeholder="用户名" value="admin">
            <input type="password" id="password" placeholder="密码" value="123456">
        </div>
        <button onclick="testLogin()">测试登录</button>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>测试获取用户信息</h2>
        <button onclick="testGetUserInfo()">获取用户信息</button>
        <div id="userInfoResult" class="result"></div>
    </div>

    <div class="test-section">
        <h2>测试退出登录</h2>
        <button onclick="testLogout()">退出登录</button>
        <div id="logoutResult" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        function showResult(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'result ' + (isSuccess ? 'success' : 'error');
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                showResult('loginResult', '正在登录...');
                
                const response = await fetch(`${API_BASE}/user/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include', // 重要：携带Cookie
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (data.code === 200) {
                    showResult('loginResult', 
                        `✅ 登录成功！\n\n` +
                        `用户ID: ${data.data.id}\n` +
                        `用户名: ${data.data.username}\n` +
                        `邮箱: ${data.data.email}\n\n` +
                        `完整响应:\n${JSON.stringify(data, null, 2)}`,
                        true
                    );
                    
                    // 检查Cookie
                    console.log('Cookies:', document.cookie);
                } else {
                    showResult('loginResult', 
                        `❌ 登录失败！\n\n` +
                        `错误码: ${data.code}\n` +
                        `错误信息: ${data.msg || data.message}\n\n` +
                        `完整响应:\n${JSON.stringify(data, null, 2)}`,
                        false
                    );
                }
            } catch (error) {
                showResult('loginResult', 
                    `❌ 请求失败！\n\n` +
                    `错误: ${error.message}\n\n` +
                    `请检查：\n` +
                    `1. 后端是否在8080端口运行\n` +
                    `2. 数据库中是否有测试用户\n` +
                    `3. 浏览器控制台是否有CORS错误`,
                    false
                );
            }
        }

        async function testGetUserInfo() {
            try {
                showResult('userInfoResult', '正在获取用户信息...');
                
                const response = await fetch(`${API_BASE}/user/info`, {
                    method: 'GET',
                    credentials: 'include' // 重要：携带Cookie
                });

                const data = await response.json();
                
                if (data.code === 200) {
                    showResult('userInfoResult', 
                        `✅ 获取成功！\n\n` +
                        `用户ID: ${data.data.id}\n` +
                        `用户名: ${data.data.username}\n` +
                        `邮箱: ${data.data.email}\n\n` +
                        `完整响应:\n${JSON.stringify(data, null, 2)}`,
                        true
                    );
                } else if (data.code === 401) {
                    showResult('userInfoResult', 
                        `⚠️ 未登录\n\n请先执行"测试登录"`,
                        false
                    );
                } else {
                    showResult('userInfoResult', 
                        `❌ 获取失败！\n\n${JSON.stringify(data, null, 2)}`,
                        false
                    );
                }
            } catch (error) {
                showResult('userInfoResult', 
                    `❌ 请求失败！\n\n${error.message}`,
                    false
                );
            }
        }

        async function testLogout() {
            try {
                showResult('logoutResult', '正在退出登录...');
                
                const response = await fetch(`${API_BASE}/user/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const data = await response.json();
                
                if (data.code === 200) {
                    showResult('logoutResult', 
                        `✅ 退出成功！\n\n${JSON.stringify(data, null, 2)}`,
                        true
                    );
                } else {
                    showResult('logoutResult', 
                        `❌ 退出失败！\n\n${JSON.stringify(data, null, 2)}`,
                        false
                    );
                }
            } catch (error) {
                showResult('logoutResult', 
                    `❌ 请求失败！\n\n${error.message}`,
                    false
                );
            }
        }

        // 页面加载时显示提示
        window.onload = function() {
            console.log('登录测试页面已加载');
            console.log('请确保：');
            console.log('1. 后端服务运行在 http://localhost:8080');
            console.log('2. 数据库中有测试用户（admin/123456）');
            console.log('3. 已执行初始化测试数据SQL脚本');
        };
    </script>
</body>
</html>
