server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: lax
        path: /
        max-age: 1800

spring:
  application:
    name: e-commerce-back
  datasource:
    url: jdbc:mysql://localhost:3306/music_share_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 200526
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  session:
